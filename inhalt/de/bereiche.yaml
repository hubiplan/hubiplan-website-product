sicherheit:
  titel: Datenschutz und Sicherheit
  kurz: Jede Person sieht nur, was sie darf. Vertrauliches ist verschlüsselt, die DSGVO-Pflichten sind eingebaut.
  stichworte: [Verschlüsselung, Rollen und Rechte, DSGVO-Werkzeuge]
  beschreibung: >-
    Datenschutz und Sicherheit in HUBIplan: Verschlüsselung je Verein, Rollen und Rechte, Passkey und
    Zwei-Faktor-Anmeldung, Änderungsprotokoll, Verarbeitungsverzeichnis und Datenpannen nach DSGVO.
  einleitung: >-
    Ein Verein trägt Verantwortung für die Daten seiner Mitglieder. HUBIplan hilft dabei: mit
    Technik, die Daten schützt, und mit Werkzeugen für die Pflichten nach der DSGVO.
  bild:
    name: szene-rollen
    alt: Rollen und Rechte eines erfundenen Demovereins
  funktionen:
    - id: daten
      titel: Ihre Daten bleiben bei Ihnen
      nutzen: Die Daten liegen auf dem Server, den der Verein wählt, nicht beim Hersteller.
      punkte:
        - Vertrauliche Felder und Dateien verschlüsselt, mit einem Schlüssel je Verein
        - Die Daten jedes Vereins zusätzlich voneinander getrennt
        - Tägliche verschlüsselte Sicherung
        - Jederzeit vollständiger Export, kein Anbieter hält die Daten fest
    - id: rechte
      titel: Rollen und Rechte
      nutzen: Wer was sehen und ändern darf, legen Sie je Verein und Abteilung fest.
      punkte:
        - Rollen mit frei wählbaren Rechten, an Ämter gebunden
        - Mit „Ansicht als Rolle“ prüfen Sie vorab, was jemand sieht
        - Jede Änderung steht im Änderungsprotokoll und lässt sich zurückverfolgen
    - id: anmeldung
      titel: Sichere Anmeldung
      nutzen: Eigener Zugang für jede Person, auf Wunsch ohne Passwort.
      punkte:
        - Passkey statt Passwort
        - Zweiter Faktor für alle mit Verwaltungsrechten
        - Heikle Schritte wie vollständige Exporte verlangen einen frischen Code
    - id: dsgvo
      titel: DSGVO-Werkzeuge
      nutzen: Die Pflichten nach der DSGVO an einer Stelle, statt in Ordnern und Tabellen.
      punkte:
        - Verzeichnis der Verarbeitungstätigkeiten aus den eingeschalteten Bausteinen, als PDF
        - Auftragsverarbeiter mit Vertrag aus den Geschäftspartnern
        - Datenpannen dokumentieren, mit der 72-Stunden-Frist für die Meldung
        - Einwilligungen etwa für Fotos und Löschfristen, Auskunft und Löschung per Anleitung
      gut: Verantwortlich im Sinne der DSGVO bleibt der Verein.
  verwandt: [mitglieder, finanzen, webseite_app]
