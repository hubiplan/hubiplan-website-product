# Seite funktionen/: Übersicht der Bereiche und alle Funktionen von A bis Z.
titel: Funktionen
beschreibung: >-
  Alle Funktionen von HUBIplan im Überblick: Mitglieder und Beiträge, Finanzen, Vereinsleben,
  Kommunikation, Webseite und App, Musik, Sport und Wettbewerbe, Datenschutz und Sicherheit.
einleitung: >-
  HUBIplan ist in Bausteine gegliedert. Jeder Verein schaltet nur ein, was er braucht, und kann
  später jederzeit weitere dazunehmen. Zu jeder Seite gibt es Hilfe mit Bildern und Anleitungen
  Schritt für Schritt, auf Deutsch oder Englisch.
bereiche_ueberschrift: Die sieben Bereiche
az_ueberschrift: Alle Funktionen von A bis Z
az_text: Jeder Eintrag führt zur Beschreibung auf der Seite seines Bereichs.
