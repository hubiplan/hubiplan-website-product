# Seite technik/api/: Beschreibung der API für andere Programme aus inhalt/openapi.json
titel: API für andere Programme
beschreibung: >-
  Alle Aufrufe und Datenformen der Schnittstelle von HUBIplan für Verbandssoftware, Webseiten
  und Fachsoftware
einleitung: >-
  Diese Seite zeigt zur Information, was die Schnittstelle von HUBIplan kann, im Stand der
  aktuellen Entwicklung. Maßgeblich ist die Beschreibung der Instanz, mit der Ihr Programm
  arbeitet: Jede HUBIplan-Instanz zeigt sie ohne Anmeldung unter `/api/partner/v1/docs/`, für
  eigene Werkzeuge als OpenAPI unter `/api/partner/v1/openapi.json`.
