barrierefreiheit:
  titel: Barrierefreiheit
  beschreibung: Wie barrierefrei die Produktwebseite von HUBIplan ist und wie Sie Barrieren melden
  inhalt: |
    Diese Seite beschreibt freiwillig, wie gut sich die Produktwebseite von HUBIplan ohne
    Barrieren nutzen lässt. Für die Vereinsverwaltung, die Vereinswebseiten und die Apps gelten
    eigene Angaben; jede Vereinswebseite hat dafür eine eigene Seite.

    ## Stand

    Maßstab sind die Web Content Accessibility Guidelines (WCAG) 2.2, Stufe AA. Zuletzt geprüft
    am 18. November 2026: automatisch mit axe für alle Seiten in beiden Sprachen bei 1440, 390
    und 320 Pixel Breite, hell und dunkel, dazu von Hand mit der Tastatur.

    Die Seite lässt sich vollständig mit der Tastatur bedienen und zeigt den Fokus deutlich. Sie
    passt sich an schmale Bildschirme, Vergrößerung und große Schrift an, folgt dem hellen oder
    dunklen Farbschema des Geräts, setzt keine Cookies und lädt nichts von fremden Servern.

    ## Bekannte Einschränkungen

    - Die Bilder sind Bildschirmfotos der Anwendung mit erfundenen Daten. Sie haben eine kurze
      Beschreibung; Tabellen und Texte darin sind nicht als Text lesbar. Was sie zeigen, steht
      auch im Text der Seite.
    - Das Bilderkarussell oben wechselt alle paar Sekunden. Es hält an, solange der Mauszeiger
      oder der Fokus darauf liegt, mit dem Knopf „Bildwechsel anhalten“ und wenn das Gerät auf weniger
      Bewegung eingestellt ist.
    - Links sind an Farbe und Schriftstärke erkennbar, nicht an einer Unterstreichung. Links zu
      anderen Seiten tragen zusätzlich einen Pfeil.

    ## Barriere melden

    Wenn Ihnen etwas den Zugang erschwert, schreiben Sie bitte an
    [kontakt@philipsen-edv.de](mailto:kontakt@philipsen-edv.de) oder melden Sie es als
    [Fehler bei GitHub](https://github.com/hubiplan/hubiplan/issues). Nennen Sie, wenn möglich,
    die Seite und Ihr Gerät oder Hilfsmittel.

