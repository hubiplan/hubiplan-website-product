start:
  titel: HUBIplan – freie Vereinsverwaltung
  beschreibung: >-
    HUBIplan ist eine freie, webbasierte Vereinsverwaltung für Vereine jeder Art, von 10 bis 10.000
    Mitgliedern: Mitglieder, Beiträge und SEPA, Kasse und E-Rechnungen, Termine, Versammlungen,
    Helferdienste, Aufgaben, Musik und Auftritte, Material und Räume, Rundschreiben, Vereinswebseite
    und App.
  kopf:
    zeile: Freie Vereinsverwaltung
    ueberschrift: Ihr Verein an einem Ort, im Browser, am Handy und auf der eigenen Webseite.
    text: >-
      HUBIplan ersetzt Excel-Listen, Papierordner und Zettelkasse durch eine gemeinsame Anwendung
      für Vorstand, Abteilungen und Mitglieder. Für Vereine von 10 bis 10.000 Mitgliedern, frei
      und auf dem eigenen Server.
    knopf_funktionen: Funktionen ansehen
    knopf_github: Quellcode auf GitHub
    karussell:
      name: Bildschirmfotos aus dem Demoverein
      zurueck: Vorheriges Bild
      weiter: Nächstes Bild
      anhalten: Bildwechsel anhalten
      abspielen: Bildwechsel starten
      bild_nr: Bild {n} von {m}
    bilder:
      - name: mitglieder
        titel: Mitglieder im Blick
        bild: Mitgliederliste eines erfundenen Demovereins in HUBIplan
      - name: szene-termine
        titel: Termine für Verein, Korps und Züge
        bild: Monatskalender mit Schützenfest und Zugabenden eines erfundenen Demovereins
      - name: szene-kapelle
        titel: Die eigene Webseite, auch für Musikvereine
        bild: Startseite der Vereinswebseite einer erfundenen Demo-Musikkapelle mit Kopfbild und Menü
      - name: szene-musik
        titel: Auftritte besetzen
        bild: >-
          Besetzung eines Auftritts des Tambourkorps mit Sollzahlen je Stimme, Zusagen und Absagen in
          einem erfundenen Demoverein
      - name: szene-aufgaben
        titel: Aufgaben teilen und erledigen
        bild: Aufgabenliste des Vorstands mit Fristen, Terminen und Zuständigen in einem erfundenen Demoverein
      - name: szene-material
        titel: Material im Blick
        bild: Materialliste mit Fahne, Festzelt und Instrumenten, Standort und Zustand in einem erfundenen Demoverein
      - name: szene-statistik
        titel: Wettbewerbe auswerten
        bild: Statistik der Korpspokalschießen mit Durchschnittswerten in einem erfundenen Demoverein
      - name: szene-mein-bereich
        titel: Mein Bereich für jedes Mitglied
        bild: Persönlicher Bereich eines Demo-Mitglieds mit Ausweis, Terminen, Ergebnissen und Rechnungen
  versprechen:
    - titel: Alles an einem Ort
      text: >-
        Mitglieder, Beiträge, Kasse, Termine, Aufgaben, Auftritte, Material, Rundschreiben,
        Dokumente, Vereinswebseite und App greifen ineinander. Nichts wird doppelt gepflegt.
    - titel: Frei und selbst betrieben
      text: >-
        Quelloffen unter der AGPL. Ihre Daten liegen auf Ihrem Server, ohne Lizenzgebühren und
        ohne Bindung an einen Anbieter, auf Wunsch unter eigenem Namen und Logo.
    - titel: Datenschutz eingebaut
      text: >-
        Vertrauliche Daten verschlüsselt mit einem Schlüssel je Verein, Mandanten zusätzlich in der
        Datenbank getrennt, Rechte je Rolle und Abteilung.
  funktionen:
    ueberschrift: Was HUBIplan kann
    einleitung: >-
      HUBIplan besteht aus mehr als 25 Modulen. Die Plattform gibt sie frei, der Verein schaltet
      selbst ein, was er braucht, und eine Vorlage schlägt beim Anlegen passende Module vor. So passt
      HUBIplan zum Sportverein genauso wie zum Musikverein, zum Schützenverein mit vielen Zügen
      oder zum Dachverband. Zu jeder Seite gibt es Hilfe mit Bildschirmfotos und Lernhilfen, die
      Oberfläche auf Deutsch oder Englisch.
    liste:
      - titel: Mitglieder
        text: >-
          Mitgliedsarten, Aufnahme mit Dublettenprüfung, Ehrungen und Jubiläen, Ämter und Würden mit
          Chronik, Mitgliedsausweis mit QR-Code (auch für Google und Apple Wallet), Import und
          Export als Excel. Auch Firmen, Vereine oder Behörden als Mitglieder, mit Ansprechpartnern
          und eigener Rechnungsanschrift.
      - titel: Kasse und Steuern
        text: >-
          Kasse nach GoBD mit Kontoauszügen und Splitbuchung, Anlagen mit Abschreibung,
          Kassenprüfung mit Stichproben und Prüfbericht, Vermögensübersicht, Rücklagen,
          zweckgebundene Spenden und Mittelverwendung. Zuwendungsbestätigungen, steuerliche
          Auswertung mit Freigrenzen-Ampel, Übungsleiter- und Ehrenamtspauschale.
      - titel: Versammlungen
        text: >-
          Mitgliederversammlungen und Vorstandssitzungen mit Tagesordnung und Einladungsfrist,
          Einladung als Rundschreiben, Anwesenheit und Beschlussfähigkeit, Protokoll mit Freigabe,
          Beschlussbuch mit Wahlen, die direkt ins Amt übernommen werden, Anträge der Mitglieder.
      - titel: Musik und Auftritte
        text: >-
          Für Musikvereine, Spielmannszüge und Tambourkorps: Musiker mit Instrumenten und Stimmen,
          Auftritte mit Sollbesetzung, Zu- und Absagen, Ersatz bei Abwesenheit, Gastmusiker per
          Link, Notenbestand, Proben, Instrumente und Uniformen, Angebot und Auftragsbestätigung,
          Veranstalterrechnung, Gagen mit Auszahlung per SEPA.
      - titel: Beiträge und Rechnungen
        text: >-
          Beitragslauf, auch nach Größe für Organisationen, Rechnungen mit QR-Code, Mahnstufen,
          SEPA-Lastschrift auch als Firmenlastschrift. E-Rechnungen als XRechnung und ZUGFeRD
          ausstellen und empfangen, an Behörden mit Leitweg-ID.
      - titel: Termine und Helferdienste
        text: >-
          Kalender für Verband, Verein und Abteilungen, Zu- und Absagen mit Anmeldeschluss,
          Erinnerungen per E-Mail, Jahresprogramm als PDF und Kalender-Abo. Dienstpläne mit
          Schichten, in die sich Mitglieder selbst eintragen.
      - titel: Material und Räume
        text: >-
          Inventar wie Fahnen, Zelte oder Instrumente und Räume wie Schießstand oder Vereinsheim,
          mit Standort, Zustand und Fotos. Buchungskalender mit Anfrage und Freigabe, Ausleihe mit
          Ausgabe und Rückgabe, Belegung auch auf der Webseite.
      - titel: Zugänge und Datenschutz
        text: >-
          Anmeldung mit Zwei-Faktor-Schutz, Rollen mit frei wählbaren Rechten je Einheit, „Ansicht
          als Rolle“, Anmeldung an der Vereins-Nextcloud. Verschlüsselte Felder und Dateien,
          Änderungsprotokoll, Einwilligungen, Löschfristen.
      - titel: Wettbewerbe
        text: >-
          Schießen und andere Wettbewerbe mit Einzel- und Mannschaftswertung, Erfassen ohne Netz,
          Live-Tabellen, Urkunden, Statistik mit Durchschnitten und Verläufen, Meldungen an fremde
          Veranstalter.
      - titel: Aufgaben
        text: >-
          Eigene Aufgaben mit Frist und Erinnerung per E-Mail oder Push, geteilt mit Personen oder
          Ämtern, verknüpft mit Terminen, wiederkehrend als Serie, auch in der App.
      - titel: Kommunikation
        text: >-
          Rundschreiben als E-Mail, Serienbrief oder Push in die App, Mailverteiler, Briefvorlage
          und Dokumentenablage mit Ordnern, Kacheln und Rechten.
      - titel: Webseite und App
        text: >-
          Vereinswebseite unter der eigenen Domain und Android-App für die Mitglieder, beide aus
          denselben Daten. Was der Vorstand in HUBIplan pflegt, steht sofort auf der Webseite und
          in der App.
  ebenen:
    ueberschrift: Für einzelne Vereine und ganze Verbände
    text: >-
      Eine Installation trägt viele Vereine. Jeder Verein verwaltet seine Mitglieder selbst,
      Abteilungen, Züge oder Gruppen lassen sich beliebig verschachteln und heißen so, wie der
      Verein es will. Ein Dachverband sieht nur, was seine Vereine freigeben. Laufen Verband und
      Verein auf getrennten Installationen, lassen sie sich verschlüsselt koppeln und tauschen
      Mitgliedermeldungen und Rechnungen aus.
    stufen:
      - titel: Plattform
        text: die Installation; schaltet Module frei
      - titel: Dachverband
        text: optional, mit eigenem Vorstand
      - titel: Verein
        text: verwaltet seine Mitglieder selbst
      - titel: Abteilungen
        text: frei verschachtelt und benannt
  bausteine:
    ueberschrift: Drei Bausteine, ein Datenbestand
    liste:
      - titel: Vereinsverwaltung
        text: >-
          Die Anwendung im Browser für Vorstand, Kasse, Abteilungen und Mitglieder. Django, React
          und PostgreSQL.
        repo: hubiplan
        bild: Kasse eines erfundenen Demovereins in HUBIplan
      - titel: Vereinswebseite
        text: >-
          Eine öffentliche Webseite unter der Domain des Vereins, gespeist aus HUBIplan: Termine,
          Vorstand, Abteilungen, Mitgliederlisten, Chronik, Galerie mit Alben, Ergebnisse des
          letzten Schießens, Repertoire aus dem Notenarchiv und Suche. Ohne zweites
          Redaktionssystem.
        repo: website
        bild: Startseite der Webseite eines erfundenen Demovereins
      - titel: Android-App
        text: >-
          Termine, Mitteilungen, Aufgaben, Helferdienste, Mitgliedsausweis (auch in Google Wallet) und
          Vereinsverwaltung unterwegs.
          Ohne Google-Bibliotheken und ohne Werbung.
        repo: android
        bild: Terminliste in der Android-App
    zum_repo: Zum Repository
    play_alt: Jetzt bei Google Play
    play_marke: Google Play und das Google Play-Logo sind Marken von Google LLC.
  ausprobieren:
    ueberschrift: Selbst ausprobieren
    text: >-
      Mit Docker läuft HUBIplan in wenigen Minuten auf dem eigenen Rechner, mit erfundenen
      Demodaten zum Anschauen.
    befehle_titel: Im Terminal
    link: Anleitung zum Ausprobieren
    betreiben: Selbst betreiben
  mitmachen:
    ueberschrift: Mitmachen
    text: >-
      HUBIplan ist freie Software. Fehlermeldungen, Ideen und Pull Requests sind willkommen,
      auch auf Englisch.
    issues: Fehler oder Idee melden
    mitwirken: Beitragsbedingungen
    sicherheit: Sicherheitslücke vertraulich melden
    releases: Versionen und Änderungen

  fragen:
    ueberschrift: Häufige Fragen
    liste:
      - frage: Was kostet HUBIplan?
        antwort: >-
          Nichts. HUBIplan ist freie Software unter der AGPL, ohne Lizenzgebühren und ohne Preis je
          Mitglied. Kosten entstehen nur für den eigenen Server, also die Miete eines kleinen
          Linux-Servers.
      - frage: Wer betreibt den Server, und was braucht man dafür?
        antwort: >-
          Der Verein selbst oder jemand seines Vertrauens. Es genügt ein gemieteter Linux-Server
          mit Docker; das HTTPS-Zertifikat holt sich HUBIplan selbst, Backups laufen täglich und
          verschlüsselt. Die [Anleitung zum Betreiben](https://github.com/hubiplan/hubiplan#selbst-betreiben)
          beschreibt die Schritte.
      - frage: Wo liegen unsere Daten, und ist das DSGVO-tauglich?
        antwort: >-
          Die Daten liegen nur auf dem Server, den der Verein wählt, nicht in einer Cloud des
          Herstellers. Vertrauliche Felder und Dateien sind mit einem Schlüssel je Verein
          verschlüsselt. Es gibt Rechte je Rolle, ein Änderungsprotokoll, Einwilligungen für Fotos
          und Löschfristen. Verantwortlich im Sinne der DSGVO bleibt der Verein.
      - frage: Wie kommen unsere Mitglieder aus Excel oder einem anderen Programm hinein?
        antwort: >-
          Mitglieder lassen sich aus einer Excel-Tabelle einlesen, mit Prüfung auf Dubletten.
          Ganze Vereine lassen sich zwischen HUBIplan-Installationen als Datei übertragen.
      - frage: Brauchen alle Mitglieder einen Zugang?
        antwort: >-
          Nein. Der Vorstand pflegt die Daten auch für Mitglieder ohne Zugang, und Rundschreiben
          gehen an Mitglieder ohne E-Mail als Serienbrief. Wer möchte, bekommt einen eigenen
          Zugang für Termine, Ausweis und eigene Daten.
      - frage: Passt das auch zu Sport-, Musik- oder Kulturvereinen?
        antwort: >-
          Ja. Die Bilder zeigen einen Schützenverein, weil HUBIplan dort entstanden ist. Abteilungen
          heißen so, wie der Verein es will, und Bereiche wie Wettbewerbe oder Würden lassen sich
          abschalten. Für Musikvereine und Spielmannszüge gibt es den Bereich Musik mit Auftritten,
          Besetzung, Noten und Proben.
      - frage: Gibt es eine App für Android und iPhone?
        antwort: >-
          Für Android gibt es die App [bei Google Play](https://play.google.com/store/apps/details?id=de.hubiplan.app),
          ganz ohne Google-Dienste. Eine eigene iPhone-App gibt es noch nicht; HUBIplan läuft aber
          im Browser auf jedem Handy.
      - frage: Wer hilft, wenn etwas nicht klappt?
        antwort: >-
          In der Anwendung gibt es Hilfe mit Bildschirmfotos und Erklärungen direkt auf den Seiten.
          Fehler und Fragen gehen an die [Issues bei GitHub](https://github.com/hubiplan/hubiplan/issues).
          Bezahlten Support oder Hosting gibt es nicht; HUBIplan ist zum Selbstbetreiben gedacht.
      - frage: Kommen wir wieder heraus, und was passiert, wenn das Projekt endet?
        antwort: >-
          Die Daten gehören dem Verein und liegen auf seinem Server. Mitgliederlisten lassen sich
          jederzeit als Excel exportieren. Weil der Quellcode offen ist, kann jeder HUBIplan
          weiter betreiben und weiterentwickeln.

