datenschutz:
  titel: Privacy
  beschreibung: Privacy notice of the HUBIplan product website
  inhalt: |
    *This is a translation; the [German version](../../datenschutz/) is binding.*

    ## 1. Controller

    Ralf Philipsen, Philipsen EDV-Dienstleistungen, Norfer Straße 48, 41468 Neuss, Germany,
    phone +49 2131 319217, email [kontakt@philipsen-edv.de](mailto:kontakt@philipsen-edv.de).

    ## 2. General

    This website consists of static pages only. It sets no cookies, uses no analytics or tracking
    tools and embeds no content from third parties. Fonts, images and styles are served from our
    own server.

    ## 3. Hosting

    The server is operated by dogado GmbH, Dortmund, in a data centre in Germany. The host
    processes data on our behalf (Art. 28 GDPR).

    ## 4. Server log files

    When you visit, the web server stores your IP address, time, requested address, status code,
    amount of data transferred, the page visited before (referrer) and your browser and operating
    system. This serves the secure operation of the website and the defence against attacks
    (legitimate interest, Art. 6(1)(f) GDPR). Log files are rotated weekly and deleted after five
    weeks at the latest. Suspicious IP addresses may be blocked automatically for a short time.

    ## 5. Encryption

    The connection is encrypted with TLS, recognisable by “https” in the address bar.

    ## 6. Contact by email or phone

    If you write to us or call us, we process your details (such as name, email address, phone
    number, content of your message) to handle your request (Art. 6(1)(b) or (f) GDPR). We delete
    them once they are no longer needed and no statutory retention period applies.

    ## 7. Links to GitHub

    This site links to the HUBIplan repositories on GitHub. Only when you follow such a link do
    you visit pages of GitHub, Inc. (USA); their privacy notice applies there.

    ## 8. Your rights

    You have the right of access, rectification, erasure, restriction of processing and data
    portability. You may object to processing based on legitimate interests on grounds relating
    to your particular situation. An informal message to the contact details above is enough.

    ## 9. Right to lodge a complaint

    You may lodge a complaint with a data protection supervisory authority. The competent
    authority is the State Commissioner for Data Protection and Freedom of Information of North
    Rhine-Westphalia (LDI NRW), Düsseldorf.

