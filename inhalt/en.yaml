start:
  titel: HUBIplan – free club management
  beschreibung: >-
    HUBIplan is free, web-based membership management for clubs and associations of any kind,
    from 10 to 10,000 members: members, fees and SEPA, cash book, events, newsletters, club
    website and app.
  kopf:
    zeile: Free club management
    ueberschrift: Your club in one place, in the browser, on the phone and on its own website.
    text: >-
      HUBIplan replaces spreadsheets, paper folders and cash boxes with one shared application
      for the board, departments and members. For clubs from 10 to 10,000 members, free and on
      your own server.
    knopf_funktionen: See the features
    knopf_github: Source code on GitHub
    karussell:
      name: Screenshots from the demo club
      zurueck: Previous picture
      weiter: Next picture
      anhalten: Pause slideshow
      abspielen: Play slideshow
      bild_nr: Picture {n} of {m}
    bilder:
      - name: mitglieder
        titel: Members at a glance
        bild: Member list of a made-up demo club in HUBIplan
      - name: szene-termine
        titel: Events with RSVPs
        bild: Event list with responses of a made-up demo club
      - name: szene-rechnungen
        titel: Collecting fees
        bild: Invoices from a fee run in a made-up demo club
      - name: szene-wettbewerbe
        titel: Competition results
        bild: Results of a competition in a made-up demo club
      - name: szene-rundschreiben
        titel: Sending newsletters
        bild: Newsletters of a made-up demo club
      - name: szene-mein-bereich
        titel: A personal area for every member
        bild: Membership card in a demo member's personal area
  versprechen:
    - titel: Everything in one place
      text: >-
        Members, fees, cash book, events, newsletters, documents, club website and app work
        together. Nothing is maintained twice.
    - titel: Free and self-hosted
      text: >-
        Open source under the AGPL. Your data stays on your server, with no licence fees and no
        vendor lock-in.
    - titel: Privacy built in
      text: >-
        Confidential data encrypted with one key per club, tenants also separated in the database,
        permissions per role and department.
  funktionen:
    ueberschrift: What HUBIplan does
    einleitung: >-
      Every area can be switched on and off on its own. HUBIplan fits a sports club as well as a
      large club with many sections or an umbrella association.
    liste:
      - titel: Members
        text: >-
          Membership types, admission with duplicate check, honours and anniversaries, offices and
          titles with history, membership card with QR code, Excel import and export.
      - titel: Access and permissions
        text: >-
          Sign-in with two-factor authentication, roles with freely chosen permissions per unit,
          “view as role” and sign-in to the club's Nextcloud.
      - titel: Fees and finance
        text: >-
          Fee runs, invoices with QR code, reminders, SEPA direct debit, GoBD-compliant cash book,
          bank statement import, digital receipts and donation receipts.
      - titel: Events
        text: >-
          Calendars for association, club and departments, RSVPs with deadlines, email reminders,
          annual programme as PDF and calendar subscription.
      - titel: Competitions
        text: >-
          Shooting and other competitions with individual and team rankings, offline entry, live
          tables, certificates and entries for external organisers.
      - titel: Communication
        text: >-
          Newsletters by email, mail merge or app push, mailing lists, letter template and a
          document library with permissions.
      - titel: Privacy
        text: >-
          Encrypted fields and files, change log, consent for photos and publication, retention
          periods.
      - titel: Help and language
        text: >-
          Help with screenshots and search, explanations right on the page, glossary, interface in
          German or English.
  ebenen:
    ueberschrift: For single clubs and whole associations
    text: >-
      One installation serves many clubs. Each club manages its own members; departments,
      sections or groups can be nested freely and named the way the club wants. An umbrella
      association only sees what its clubs share.
    stufen:
      - titel: Platform
        text: the installation; enables modules
      - titel: Association
        text: optional, with its own board
      - titel: Club
        text: manages its own members
      - titel: Departments
        text: nested and named freely
  bausteine:
    ueberschrift: Three components, one set of data
    liste:
      - titel: Club management
        text: >-
          The browser application for the board, treasurer, departments and members. Django,
          React and PostgreSQL.
        repo: hubiplan
        bild: Cash book of a made-up demo club in HUBIplan
      - titel: Club website
        text: >-
          A public website on the club's own domain, fed from HUBIplan: events, board,
          departments, history. No second content management system.
        repo: website
        bild: Home page of a made-up demo club's website
      - titel: Android app
        text: >-
          Events, messages, membership card and club management on the go. A variant without
          Google services for F-Droid.
        repo: android
        bild: Event list in the Android app
    zum_repo: To the repository
  ausprobieren:
    ueberschrift: Try it yourself
    text: >-
      With Docker, HUBIplan runs on your own computer in a few minutes, with made-up demo data to
      look around.
    befehle_titel: In a terminal
    link: How to try it
    betreiben: Run it yourself
  mitmachen:
    ueberschrift: Contribute
    text: >-
      HUBIplan is free software. Bug reports, ideas and pull requests are welcome, in English
      too.
    issues: Report a bug or idea
    mitwirken: Contribution terms
    sicherheit: Report a vulnerability privately
    releases: Releases and changes

