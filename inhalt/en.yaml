start:
  titel: HUBIplan – free and open-source club management
  beschreibung: >-
    HUBIplan is free, web-based club management for clubs and associations of any kind, from 10
    to 10,000 members: members, fees and SEPA, cash book and e-invoices, events, paid event
    registration, meetings, volunteer shifts, tasks, notice board, polls, group orders, training,
    music and performances, equipment and rooms, newsletters, club website and app.
  kopf:
    zeile: Free and open-source club management
    ueberschrift: Your club in one place, in the browser, on the phone and on its own website.
    text: >-
      HUBIplan replaces spreadsheets, paper folders and paper cash books with one shared
      application for the board, departments and members. For clubs from 10 to 10,000 members,
      with no licence fees and on a server of your choice.
    knopf_funktionen: See the features
    knopf_loslegen: Getting started
    hinweis_bilder: >-
      The pictures show a made-up shooting club and a made-up band; every club sets its own terms
      and areas.
    karussell:
      name: Screenshots from the demo club
      spur: Pictures, use the arrow keys to browse
      zurueck: Previous picture
      weiter: Next picture
      anhalten: Pause slideshow
      abspielen: Play slideshow
      bild_nr: Picture {n} of {m}
    bilder:
      - name: szene-start
        titel: The home page shows what is due
        bild: >-
          Management home page of a made-up demo club with upcoming tasks and the button to customise the home page
      - name: mitglieder
        titel: Members at a glance
        bild: >-
          Detail of a made-up demo club's member list with name, membership type and date of birth
      - name: szene-termine
        titel: Events for the club and its sections
        bild: >-
          Detail of the monthly calendar with practice evenings, a meeting and a serenade in a made-up demo club
      - name: szene-aufgaben
        titel: Sharing and completing tasks
        bild: >-
          Open tasks of the board in a made-up demo club
      - name: szene-kapelle
        titel: Your own website, for bands too
        bild: >-
          Home page of the club website of a made-up demo band with welcome text and upcoming events
      - name: szene-musik
        titel: Staffing performances
        bild: >-
          Target line-up of a performance with parts, required numbers and assigned musicians in a made-up demo club
      - name: szene-mein-bereich
        titel: A personal area for every member
        bild: >-
          Personal area of a demo member with tasks, membership card, meetings and competitions
  versprechen_name: At a glance
  versprechen:
    - titel: Everything in one place
      text: >-
        Members, fees, cash book, events, newsletters, club website and app work together. Nothing
        is maintained twice, and the home page shows by itself what is due.
    - titel: Free and independent
      text: >-
        Free software with no licence fees. Your data stays on a server of your choice, with no
        vendor lock-in, under your own name and logo if you like.
    - titel: Privacy built in
      text: >-
        Confidential data encrypted with one key per club, each club's data also kept separate,
        permissions per role and department.
  funktionen:
    ueberschrift: What HUBIplan can do
    einleitung: >-
      Seven areas that work together. Each club switches on only what it needs; every page comes
      with help, pictures and guides, in German or English.
    alle: All features from A to Z
  szenen:
    ueberschrift: An ordinary month at the club
    liste:
      - titel: The treasurer
        text: >-
          fetches the transactions from the bank. HUBIplan recognises the fees, marks the invoices as
          paid and attaches the receipts.
      - titel: The youth leader
        text: >-
          posts on the notice board that the bus leaves later. Everyone sees it in the app, without
          a chain email.
      - titel: The chair
        text: >-
          runs the general meeting. Whoever cannot come votes online, and the result goes straight
          into the minutes.
  ebenen:
    ueberschrift: For single clubs and whole associations
    text: >-
      One installation serves many clubs. Each club manages its own members, with departments and
      groups named its own way; an umbrella association only sees what its clubs share. Separate
      installations can be linked with encryption.
    stufen:
      - titel: Platform
        text: the installation; provides the areas
      - titel: Association
        text: optional, with its own board
      - titel: Club
        text: manages its own members
      - titel: Departments
        text: nested and named freely
  bausteine:
    ueberschrift: Management, website and app in one
    liste:
      - titel: Club management
        text: >-
          The browser application for the board, treasurer, departments and members, on a
          computer, tablet or phone.
        repo: hubiplan
        bild: Detail of the cash book of a made-up demo club in HUBIplan
      - titel: Club website
        text: >-
          A public website under the club's own domain, fed from HUBIplan: events, board,
          departments, gallery, membership application and more, in your own colours and fonts.
          No second content management system.
        repo: website
        bild: Detail of the home page of a made-up demo club's website
      - titel: Android app
        text: >-
          Events, notice board, membership card and voting for members; applications, bookings and
          admission for the board. No ads. An iPhone app is in the works.
        repo: android
        bild: Event list in the Android app
    play_alt: Get it on Google Play
    play_marke: Google Play and the Google Play logo are trademarks of Google LLC.
  loslegen:
    ueberschrift: Getting started
    text: >-
      HUBIplan costs nothing, but it does not run by itself. **You need someone who can look
      after a server.** We do not offer hosting or paid support.
    schritte:
      - titel: 1 Look around
        text: >-
          Look at the features and pictures, and agree with your board which areas your club
          needs.
        link: See the features
        ziel: ansehen
      - titel: 2 Try it out
        text: >-
          Someone with a little technical experience starts HUBIplan on their own computer in a
          few minutes, with made-up sample data to click through.
        link: How to try it
        ziel: ausprobieren
      - titel: 3 Run it
        text: >-
          For real use, a small rented Linux server is enough. Its rent is the only running cost;
          you bring your members over from an Excel spreadsheet.
        link: What running it takes
        ziel: betreiben
    mehr: All about getting started
  fragen:
    ueberschrift: Frequently asked questions
    alle: All questions

  wer:
    ueberschrift: Who is behind it
    text: >-
      HUBIplan is developed and published by Ralf Philipsen (Philipsen EDV). It was built for a
      shooting club with many sections and its umbrella association, where it is in everyday
      use. All features are kept general so that clubs of any kind can use them.
    fassung_titel: "Current release:"
    fassung: 2026.11.1 of 22 November 2026
    aenderungen: All changes
    kontakt_titel: "Contact:"
    kontakt: "[kontakt@philipsen-edv.de](mailto:kontakt@philipsen-edv.de) (German or English)"

technik:
  titel: For the technically minded
  beschreibung: >-
    Trying out and running HUBIplan yourself: requirements, commands and source code of the free
    club management system
  einleitung: >-
    This page is for the person who tries out, sets up and looks after HUBIplan for a club. All
    guides are kept with the source code on GitHub; most of them are in German.
  ausprobieren:
    ueberschrift: Try it on your own computer
    text: >-
      With Docker, HUBIplan runs on your own computer in a few minutes, with made-up demo data to
      look around.
    befehle_titel: In a terminal
    link: How to try it (in German)
  betreiben:
    ueberschrift: Run it yourself
    punkte:
      - A Linux server with Docker and the Compose plugin; a small rented server is enough.
      - Deployment runs over SSH from a computer with the repository; if the start fails, it
        returns to the previous version automatically.
      - Caddy obtains the HTTPS certificate by itself, also behind an existing web server.
      - Daily encrypted backups with a restore test; new releases are signed.
      - Anyone running HUBIplan for others follows the AGPL and offers the source code of the
        running version.
    link: How to run it (in German)
  schnittstelle:
    ueberschrift: Interface for other programs
    text: >-
      Association software, a website of your own or scoring software can work with HUBIplan
      through a documented interface (REST, JSON, OpenAPI 3).
    punkte:
      - The board of a unit issues the key under Settings › API accesses; it applies to exactly
        one unit, only to the ticked areas and expires by itself.
      - Personal data is only released with a named recipient and a confirmed legal basis, and
        every retrieval is logged.
      - Writing has to be allowed separately; changes to members only arrive as a proposal,
        nothing is deleted or sent.
      - "Every instance describes its interface without sign-in: readable at
        `/api/partner/v1/docs/`, machine-readable at `/api/partner/v1/openapi.json`."
    beschreibung: View all calls and data shapes
    link: Guide for developers (in German)
  quellcode:
    ueberschrift: Technology and source code
    text: HUBIplan consists of five repositories, all free under the AGPL.
    technik: "Built with:"
    link: View the source on GitHub
    liste:
      - titel: Club management
        text: Backend, interface and operations.
        technik: Django, React and PostgreSQL
        repo: hubiplan
      - titel: Club website
        text: Public club websites from HUBIplan's data.
        technik: Django, reads only the public interface
        repo: website
      - titel: Android app
        text: App for members, board and treasurer; the free variant needs no Google services.
        technik: Kotlin and Jetpack Compose
        repo: android
      - titel: iPhone app
        text: App for iPhone and iPad, in the works.
        technik: Swift and SwiftUI
        repo: ios
      - titel: Product website
        text: This website, as static files without cookies.
        technik: Python and Jinja2
        repo: produktseite
  mitmachen:
    ueberschrift: Contribute
    text: >-
      Bug reports, ideas and pull requests are welcome, in English too.
    issues: Report a bug or idea
    mitwirken: Contributing guide (in German, with English summary)
    sicherheit: Report a vulnerability privately
    releases: Releases and changes

