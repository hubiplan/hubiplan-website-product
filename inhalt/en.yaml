barrierefreiheit:
  titel: Accessibility
  beschreibung: How accessible the HUBIplan product website is and how to report barriers
  inhalt: |
    This page describes, voluntarily, how well the HUBIplan product website can be used without
    barriers. The club management, the club websites and the apps have their own statements;
    every club website has its own page for this.

    ## Status

    The standard is the Web Content Accessibility Guidelines (WCAG) 2.2, level AA. Last checked
    on 18 November 2026: automatically with axe for all pages in both languages at 1440, 390 and
    320 pixels wide, light and dark, plus by hand with the keyboard.

    The site can be used entirely with the keyboard and shows the focus clearly. It adapts to
    narrow screens, zoom and large text, follows the device's light or dark colour scheme, sets
    no cookies and loads nothing from other servers.

    ## Known limitations

    - The pictures are screenshots of the application with made-up data. They have a short
      description; tables and text inside them cannot be read as text. What they show is also
      described in the text of the page.
    - The picture carousel at the top changes every few seconds. It stops while the mouse
      pointer or the focus is on it, with the “Pause slideshow” button, and when the device is set to
      reduce motion.
    - Links are recognisable by colour and font weight, not by underlining. Links to other
      sites also carry an arrow.

    ## Report a barrier

    If something makes access difficult for you, please write to
    [kontakt@philipsen-edv.de](mailto:kontakt@philipsen-edv.de) or report it as an
    [issue on GitHub](https://github.com/hubiplan/hubiplan/issues). If possible, name the page
    and your device or assistive technology.

