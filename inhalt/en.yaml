start:
  titel: HUBIplan – free club management
  beschreibung: >-
    HUBIplan is free, web-based membership management for clubs and associations of any kind,
    from 10 to 10,000 members: members, fees and SEPA, cash book and e-invoices, events, tasks,
    music and performances, equipment, newsletters, club website and app.
  kopf:
    zeile: Free club management
    ueberschrift: Your club in one place, in the browser, on the phone and on its own website.
    text: >-
      HUBIplan replaces spreadsheets, paper folders and cash boxes with one shared application
      for the board, departments and members. For clubs from 10 to 10,000 members, free and on
      your own server.
    knopf_funktionen: See the features
    knopf_github: Source code on GitHub
    karussell:
      name: Screenshots from the demo club
      zurueck: Previous picture
      weiter: Next picture
      anhalten: Pause slideshow
      abspielen: Play slideshow
      bild_nr: Picture {n} of {m}
    bilder:
      - name: mitglieder
        titel: Members at a glance
        bild: Member list of a made-up demo club in HUBIplan
      - name: szene-termine
        titel: Events for the club, corps and platoons
        bild: Monthly calendar with the shooting festival and platoon evenings of a made-up demo club
      - name: szene-kapelle
        titel: Your own website, for bands too
        bild: Home page of the club website of a made-up demo band with header image and menu
      - name: szene-musik
        titel: Staffing performances
        bild: >-
          Line-up of a drum corps performance with required players per part, acceptances and
          declines in a made-up demo club
      - name: szene-aufgaben
        titel: Sharing and completing tasks
        bild: Task list of the board with due dates, events and people responsible in a made-up demo club
      - name: szene-material
        titel: Keeping track of equipment
        bild: Equipment list with flag, festival tent and instruments, location and condition in a made-up demo club
      - name: szene-statistik
        titel: Competition statistics
        bild: Statistics of the corps cup shootings with averages in a made-up demo club
      - name: szene-mein-bereich
        titel: A personal area for every member
        bild: Personal area of a demo member with membership card, events, results and invoices
  versprechen:
    - titel: Everything in one place
      text: >-
        Members, fees, cash book, events, tasks, performances, equipment, newsletters, documents,
        club website and app work together. Nothing is maintained twice.
    - titel: Free and self-hosted
      text: >-
        Open source under the AGPL. Your data stays on your server, with no licence fees and no
        vendor lock-in.
    - titel: Privacy built in
      text: >-
        Confidential data encrypted with one key per club, tenants also separated in the database,
        permissions per role and department.
  funktionen:
    ueberschrift: What HUBIplan does
    einleitung: >-
      Every area can be switched on and off on its own. HUBIplan fits a sports club as well as a
      music society, a large club with many sections or an umbrella association.
    liste:
      - titel: Members
        text: >-
          Membership types, admission with duplicate check, honours and anniversaries, offices and
          titles with history, membership card with QR code (also for Google and Apple Wallet),
          Excel import and export.
      - titel: Events
        text: >-
          Calendars for association, club and departments, RSVPs with deadlines, email reminders,
          annual programme as PDF and calendar subscription.
      - titel: Communication
        text: >-
          Newsletters by email, mail merge or app push, mailing lists, letter template and a
          document library with folders, tiles and permissions.
      - titel: Fees and finance
        text: >-
          Fee runs, invoices with QR code, reminders, SEPA direct debit, GoBD-compliant cash book,
          bank statement import, digital receipts and donation receipts. Plus business partners
          and e-invoices: issue and receive XRechnung and ZUGFeRD, with validation, advance
          payments and final invoices.
      - titel: Tasks
        text: >-
          Your own tasks with due dates and reminders by email or push, shared with people or
          offices, linked to events, recurring as a series, also in the app.
      - titel: Competitions
        text: >-
          Shooting and other competitions with individual and team rankings, offline entry, live
          tables, certificates, statistics with averages and personal trends, entries for
          external organisers.
      - titel: Music and performances
        text: >-
          For music societies, marching bands and drum corps: musicians with instruments and parts,
          performances with required line-up, acceptances and declines, substitutes for absences,
          guest musicians via link, sheet music library, rehearsals, instruments and uniforms,
          offer and order confirmation, invoices to the organiser, fees paid out by SEPA transfer.
      - titel: Equipment
        text: >-
          Inventory such as flags, tents or instruments with location, condition and photos,
          linked to events, tasks and documents.
      - titel: Access and permissions
        text: >-
          Sign-in with two-factor authentication, roles with freely chosen permissions per unit,
          “view as role” and sign-in to the club's Nextcloud.
      - titel: Privacy
        text: >-
          Encrypted fields and files, change log, consent for photos and publication, retention
          periods.
      - titel: Help and language
        text: >-
          Help with screenshots and search, explanations right on the page, glossary, interface in
          German or English.
      - titel: Website and app
        text: >-
          A club website on the club's own domain and an Android app for members, both from the
          same data. Whatever the board maintains in HUBIplan appears right away on the website
          and in the app.
  ebenen:
    ueberschrift: For single clubs and whole associations
    text: >-
      One installation serves many clubs. Each club manages its own members; departments,
      sections or groups can be nested freely and named the way the club wants. An umbrella
      association only sees what its clubs share. If association and club run on separate
      installations, they can be linked with encryption.
    stufen:
      - titel: Platform
        text: the installation; enables modules
      - titel: Association
        text: optional, with its own board
      - titel: Club
        text: manages its own members
      - titel: Departments
        text: nested and named freely
  bausteine:
    ueberschrift: Three components, one set of data
    liste:
      - titel: Club management
        text: >-
          The browser application for the board, treasurer, departments and members. Django,
          React and PostgreSQL.
        repo: hubiplan
        bild: Cash book of a made-up demo club in HUBIplan
      - titel: Club website
        text: >-
          A public website on the club's own domain, fed from HUBIplan: events, board,
          departments, member lists, history, photo gallery with albums, results of the latest
          shooting, repertoire from the sheet music library and search. No second content
          management system.
        repo: website
        bild: Home page of a made-up demo club's website
      - titel: Android app
        text: >-
          Events, messages, tasks, membership card (also in Google Wallet) and club management on
          the go. A variant
          without Google services for F-Droid.
        repo: android
        bild: Event list in the Android app
    zum_repo: To the repository
  ausprobieren:
    ueberschrift: Try it yourself
    text: >-
      With Docker, HUBIplan runs on your own computer in a few minutes, with made-up demo data to
      look around.
    befehle_titel: In a terminal
    link: How to try it
    betreiben: Run it yourself
  mitmachen:
    ueberschrift: Contribute
    text: >-
      HUBIplan is free software. Bug reports, ideas and pull requests are welcome, in English
      too.
    issues: Report a bug or idea
    mitwirken: Contribution terms
    sicherheit: Report a vulnerability privately
    releases: Releases and changes

  fragen:
    ueberschrift: Frequently asked questions
    liste:
      - frage: What does HUBIplan cost?
        antwort: >-
          Nothing. HUBIplan is free software under the AGPL, with no licence fees and no price per
          member. The only cost is your own server, i.e. renting a small Linux server.
      - frage: Who runs the server, and what does it take?
        antwort: >-
          The club itself or someone it trusts. A rented Linux server with Docker is enough;
          HUBIplan obtains its HTTPS certificate by itself, and backups run daily and encrypted.
          The [guide to running it](https://github.com/hubiplan/hubiplan#selbst-betreiben)
          describes the steps.
      - frage: Where is our data, and is it GDPR-compliant?
        antwort: >-
          The data is only on the server the club chooses, not in a vendor's cloud. Confidential
          fields and files are encrypted with one key per club. There are permissions per role, a
          change log, consent for photos and retention periods. The club remains the controller
          under the GDPR.
      - frage: How do we get our members in from Excel or another program?
        antwort: >-
          Members can be imported from an Excel spreadsheet, with a duplicate check. Whole clubs
          can be transferred between HUBIplan installations as a file.
      - frage: Do all members need an account?
        antwort: >-
          No. The board maintains the data for members without an account too, and newsletters
          reach members without email as a mail merge letter. Anyone who wants one gets their own
          account for events, membership card and personal data.
      - frage: Does it suit sports, music or cultural clubs?
        antwort: >-
          Yes. The pictures show a shooting club because that is where HUBIplan was born.
          Departments are named the way the club wants, and areas such as competitions or honours
          can be switched off. For music societies and marching bands there is the music area with
          performances, line-ups, sheet music and rehearsals.
      - frage: Is there an app for Android and iPhone?
        antwort: >-
          There is an Android app, also in a version without Google services. There is no iPhone
          app yet, but HUBIplan runs in the browser on any phone.
      - frage: Who helps when something does not work?
        antwort: >-
          The application has help with screenshots and explanations right on the pages. Bugs and
          questions go to the [issues on GitHub](https://github.com/hubiplan/hubiplan/issues). There is
          no paid support or hosting; HUBIplan is meant to be run by the club itself.
      - frage: Can we leave again, and what happens if the project ends?
        antwort: >-
          The data belongs to the club and lives on its server. Member lists can be exported to
          Excel at any time. Because the source code is open, anyone can keep running and
          developing HUBIplan.

